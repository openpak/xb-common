name: test

# Runs only on pushed release tags (and manually), like every OpenPak repository.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      GOWORK: 'off'
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
